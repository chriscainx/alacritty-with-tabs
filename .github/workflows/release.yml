name: Release

on:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: target/release/alacritty.exe
